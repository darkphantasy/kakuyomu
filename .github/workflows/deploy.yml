name: Deploy to Google Apps Script

# リポジトリのコードを GAS 側に反映する(手動実行のみ)。
# 普段の編集を GAS のオンラインエディタで行っている場合、
# 自動デプロイは編集内容を上書きする恐れがあるため、
# GitHub 側でコードを修正したときだけ Actions タブから手動で実行する。
on:
  workflow_dispatch:
    inputs:
      project:
        description: "デプロイするプロジェクト"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - kaku_scraping
          - kaku2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        run: echo "$CLASPRC_JSON" > ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Push to Apps Script
        run: |
          if [ "${{ inputs.project }}" = "both" ] || [ "${{ inputs.project }}" = "kaku_scraping" ]; then
            (cd kaku_scraping && clasp push -f)
          fi
          if [ "${{ inputs.project }}" = "both" ] || [ "${{ inputs.project }}" = "kaku2" ]; then
            (cd kaku2 && clasp push -f)
          fi
