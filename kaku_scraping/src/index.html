<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --line: #dfe3e8;
        --text: #1f2328;
        --muted: #6b7280;
        --accent: #1f3864;
        --danger: #b3261e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 16px;
        background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
                     "Noto Sans JP", Meiryo, sans-serif;
        font-size: 14px; line-height: 1.6;
      }
      .wrap { max-width: 980px; margin: 0 auto; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      h2 { font-size: 14px; margin: 0 0 10px; color: var(--accent); }
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 8px;
        padding: 14px; margin-bottom: 14px;
      }
      .status {
        display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
        font-size: 13px; color: var(--muted);
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa4b2; display: inline-block; }
      .dot.on { background: #2da44e; animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .35; } }
      label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
      input[type=text], input[type=number] {
        width: 100%; padding: 8px 10px; border: 1px solid var(--line);
        border-radius: 6px; font-size: 14px; font-family: inherit; background: #fff;
      }
      .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      button {
        padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px;
        background: #fff; color: var(--text); font-size: 13px; font-family: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: #eef1f5; }
      button:disabled { opacity: .5; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover:not(:disabled) { background: #2c4d8a; }
      button.mini { padding: 4px 9px; font-size: 12px; }
      button.danger { color: var(--danger); border-color: #e6c9c6; }
      details summary { cursor: pointer; font-size: 12px; color: var(--muted); margin-top: 10px; }
      .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
      th.sortable { cursor: pointer; user-select: none; }
      th.sortable:hover { color: var(--accent); }
      th .ind { font-size: 10px; }
      .filter-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
      .filter-row input { flex: 1; }
      td.num, th.num { text-align: right; white-space: nowrap; }
      .title-short { font-weight: 600; }
      .title-full { font-size: 11px; color: var(--muted); word-break: break-all; }
      .docs a { font-size: 12px; margin-right: 6px; white-space: nowrap; }
      .row-actions { display: flex; gap: 6px; white-space: nowrap; }
      #log { font-size: 12px; color: var(--muted); max-height: 180px; overflow-y: auto; }
      #log div { padding: 3px 0; border-bottom: 1px solid #eef0f3; }
      #log .err { color: var(--danger); }
      .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
      @media (max-width: 640px) {
        .grid3 { grid-template-columns: 1fr; }
        .hide-sp { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>カクヨム取得コンソール</h1>
        <div class="status">
          <span><span id="dot" class="dot"></span> <span id="runText">読み込み中…</span></span>
          <span id="queueText"></span>
          <span id="links"></span>
        </div>
      </div>

      <div class="card">
        <h2>取得</h2>
        <label for="url">作品URL</label>
        <input type="text" id="url" placeholder="https://kakuyomu.jp/works/...">
        <details>
          <summary>詳細オプション（初回取得の範囲指定・既存ドキュメントの紐付け）</summary>
          <div class="grid3">
            <div>
              <label for="startEp">開始話数（空欄=1）</label>
              <input type="number" id="startEp" min="1" placeholder="1">
            </div>
            <div>
              <label for="endEp">終了話数（空欄=最後まで）</label>
              <input type="number" id="endEp" min="1" placeholder="">
            </div>
            <div>
              <label for="docIds">既存ドキュメントID（カンマ区切り）</label>
              <input type="text" id="docIds" placeholder="一覧に追加する時のみ">
            </div>
          </div>
        </details>
        <div class="btns">
          <button class="primary" onclick="doStartFetch()">初回取得</button>
          <button onclick="doStartCont()">続き取得</button>
          <button onclick="doSeed()">一覧に追加（現在地を記録）</button>
        </div>
      </div>

      <div class="card">
        <h2>一覧 <span id="workCount" style="color:var(--muted);font-weight:400"></span></h2>
        <div class="btns" style="margin-top:0">
          <button class="primary" onclick="doContAll()">一括続き取得</button>
          <button onclick="doSync()">索引と差分同期</button>
          <button onclick="doRebuild()">索引を再生成</button>
        </div>
        <div class="filter-row">
          <input type="text" id="filter" placeholder="作品名で絞り込み" oninput="renderTable()">
          <button class="mini" onclick="clearFilter()">クリア</button>
        </div>
        <table>
          <thead>
            <tr>
              <th class="sortable" data-key="title">作品 <span class="ind"></span></th>
              <th class="sortable num" data-key="total">話数 <span class="ind"></span></th>
              <th class="sortable hide-sp" data-key="updatedAt">最終更新 <span class="ind"></span></th>
              <th class="hide-sp">ドキュメント</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="works"></tbody>
        </table>
        <div id="worksEmpty" class="empty" style="display:none"></div>
      </div>

      <div class="card">
        <h2>設定・その他</h2>
        <div class="btns" style="margin-top:0">
          <button onclick="doToggleShort()">ファイル名短縮: <b id="shortState">…</b></button>
          <button onclick="doClearQueue()">順番待ちをクリア</button>
          <button onclick="refresh()">今すぐ更新</button>
        </div>
      </div>

      <div class="card">
        <h2>ログ</h2>
        <div id="log"></div>
      </div>
    </div>

    <script>
      var busy = false;
      var timer = null;
      var lastState = null;                                      // 直近に取得した状態
      var view = { sortKey: 'updatedAt', sortDir: 'desc' };       // 一覧の並び替え設定

      // ドキュメントサイズ（参考値・目安）。7秒ポーリングとは別経路で問い合わせる。
      //   更新するのは「ページ再読込時」と「取得が完了した作品」だけ。
      //   時間経過だけでの再取得はしない（サーバー側は finishRun のタイミングで
      //   該当ドキュメントのキャッシュを明示的に無効化しているため、問い合わせれば
      //   常に最新の値が返る）。
      //
      //   完了検知は running.active の true→false エッジでは行わない。一括続き取得は
      //   数十分〜数時間かかることがあり、タブがバックグラウンドだとポーリングが
      //   間引かれ、遷移の瞬間を取りこぼしてタブに戻ってきても二度と検出できなくなる。
      //   代わりに、作品ごとの updatedAt を前回ポーリング時と比較し、**変化した作品だけ**
      //   その場でサイズを取り直す（ポーリングが間引かれていても、次に動いた時点で
      //   前回見た値との差分としてまとめて拾える）。
      var docSizes = {};          // docId -> bytes
      var pendingSizeIds = {};    // docId -> true（問い合わせ中の重複防止）
      var knownUpdatedAt = {};    // workId -> 前回ポーリング時点の updatedAt

      // まだ一度もサイズを取得していない docId だけをまとめて問い合わせる（主にページ読込時）
      function maybeFetchSizes(works) {
        var need = [];
        works.forEach(function (w) {
          w.docIds.forEach(function (id) {
            if (pendingSizeIds[id]) return;
            if (Object.prototype.hasOwnProperty.call(docSizes, id)) return;
            need.push(id);
          });
        });
        if (need.length > 0) fetchSizes(need);
      }

      // 前回ポーリング時から updatedAt が変わった作品のドキュメントだけ取り直す
      //   （1作品完了するたびに、その作品ぶんだけ更新される）
      function refreshChangedWorkSizes(works) {
        var changed = [];
        var seenWorkIds = {};
        works.forEach(function (w) {
          seenWorkIds[w.workId] = true;
          var prev = knownUpdatedAt[w.workId];
          if (prev !== undefined && prev !== w.updatedAt) changed = changed.concat(w.docIds);
          knownUpdatedAt[w.workId] = w.updatedAt;
        });
        // 一覧から消えた作品（削除された）の記録は掃除しておく
        Object.keys(knownUpdatedAt).forEach(function (id) {
          if (!seenWorkIds[id]) delete knownUpdatedAt[id];
        });
        if (changed.length > 0) fetchSizes(changed);
      }

      function fetchSizes(ids) {
        ids.forEach(function (id) { pendingSizeIds[id] = true; });
        google.script.run
          .withSuccessHandler(function (sizes) {
            ids.forEach(function (id) {
              docSizes[id] = (sizes && sizes[id]) || 0;
              delete pendingSizeIds[id];
            });
            renderTable();
          })
          .withFailureHandler(function () {
            ids.forEach(function (id) { delete pendingSizeIds[id]; }); // 次回また試す
          })
          .webGetDocSizes(ids);
      }

      function $(id) { return document.getElementById(id); }

      function log(msg, isErr) {
        var el = document.createElement('div');
        if (isErr) el.className = 'err';
        var t = new Date().toTimeString().slice(0, 8);
        el.textContent = '[' + t + '] ' + msg;
        var box = $('log');
        box.insertBefore(el, box.firstChild);
        while (box.childNodes.length > 60) box.removeChild(box.lastChild);
      }

      function setBusy(b) {
        busy = b;
        var btns = document.querySelectorAll('button');
        for (var i = 0; i < btns.length; i++) btns[i].disabled = b;
      }

      // サーバー関数を呼び、{ok,message} を受け取って表示・再描画する
      function call(fnName, args, okMsgPrefix) {
        if (busy) return;
        setBusy(true);
        var runner = google.script.run
          .withSuccessHandler(function (res) {
            setBusy(false);
            if (res && res.ok === false) log((okMsgPrefix || '') + (res.message || '失敗しました。'), true);
            else log((okMsgPrefix || '') + ((res && res.message) || '完了しました。'));
            refresh();
          })
          .withFailureHandler(function (err) {
            setBusy(false);
            log('サーバーエラー: ' + err.message, true);
          });
        runner[fnName].apply(runner, args || []);
      }

      function refresh() {
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(function (err) { log('状態取得に失敗: ' + err.message, true); })
          .webGetState();
      }

      function render(s) {
        lastState = s;
        refreshChangedWorkSizes(s.works); // 完了した（updatedAtが変わった）作品を取り直す
        maybeFetchSizes(s.works);         // 新しく現れた（未取得の）docId も取りに行く

        var r = s.running;
        $('dot').className = 'dot' + (r.active ? ' on' : '');
        if (!r.active) {
          $('runText').textContent = '待機中';
        } else if (r.batchNext) {
          $('runText').textContent = '1作品完了。次の作品を準備中…';
        } else {
          var prog = r.total ? (' ' + r.done + ' / ' + r.total + ' 話') : '';
          $('runText').textContent = '実行中: ' + (r.title || '(不明)') + '（' + r.phase + '）' + prog;
        }
        $('queueText').textContent = s.queueCount ? ('順番待ち ' + s.queueCount + ' 件') : '順番待ちなし';
        $('shortState').textContent = s.shortFilename ? 'ON' : 'OFF';

        renderTable();
      }

      // 並び替えの比較。第1キーが同値のときはタイトル・作品IDまで見て順序を固定する
      //   （自動更新のたびに行が入れ替わるのを防ぐ。サーバー側と同じ考え方）
      function compareWorks(a, b) {
        var dir = (view.sortDir === 'asc') ? 1 : -1;
        var v = 0;
        if (view.sortKey === 'total') {
          v = (Number(a.total) || 0) - (Number(b.total) || 0);
        } else if (view.sortKey === 'title') {
          v = (a.shortTitle || '').localeCompare(b.shortTitle || '', 'ja');
        } else {
          v = (a.updatedAt || '').localeCompare(b.updatedAt || '');
        }
        if (v !== 0) return v * dir;

        var t = (a.title || '').localeCompare(b.title || '', 'ja');
        if (t !== 0) return t;
        return (a.workId || '').localeCompare(b.workId || '');
      }

      // 一覧の描画（絞り込み・並び替えはすべてクライアント側で行い、サーバーは呼ばない）
      function renderTable() {
        if (!lastState) return;

        var q = $('filter').value.trim().toLowerCase();
        var list = lastState.works.filter(function (w) {
          if (!q) return true;
          return ((w.shortTitle || '') + ' ' + (w.title || '')).toLowerCase().indexOf(q) >= 0;
        });
        list.sort(compareWorks);

        var total = lastState.works.length;
        $('workCount').textContent = q
          ? '（' + list.length + ' / ' + total + ' 作品）'
          : '（' + total + ' 作品）';

        // 並び替えインジケータ
        var ths = document.querySelectorAll('th.sortable');
        for (var i = 0; i < ths.length; i++) {
          var ind = ths[i].querySelector('.ind');
          ind.textContent = (ths[i].getAttribute('data-key') === view.sortKey)
            ? (view.sortDir === 'asc' ? '▲' : '▼') : '';
        }

        var tb = $('works');
        tb.textContent = '';
        var empty = $('worksEmpty');
        if (list.length) {
          empty.style.display = 'none';
        } else {
          empty.style.display = 'block';
          empty.textContent = total ? '絞り込みに一致する作品がありません。' : '記録がありません。';
        }

        list.forEach(function (w) {
          var tr = document.createElement('tr');

          var tdTitle = document.createElement('td');
          var d1 = document.createElement('div');
          d1.className = 'title-short';
          d1.textContent = w.shortTitle;           // textContent なので HTML として解釈されない
          var d2 = document.createElement('div');
          d2.className = 'title-full';
          d2.textContent = w.title;
          tdTitle.appendChild(d1);
          tdTitle.appendChild(d2);

          var tdTotal = document.createElement('td');
          tdTotal.className = 'num';
          tdTotal.textContent = w.total;

          var tdUpd = document.createElement('td');
          tdUpd.className = 'hide-sp';
          tdUpd.textContent = w.updatedAt;

          var tdDocs = document.createElement('td');
          tdDocs.className = 'docs hide-sp';
          w.docIds.forEach(function (id, i) {
            // サイズ0（削除済み・アクセス不可）が判明しているものはリンクごと出さない。
            // まだサイズ未取得の間はサイズ表記なしでリンクだけ出す。
            var isKnown = Object.prototype.hasOwnProperty.call(docSizes, id);
            var bytes = docSizes[id];
            if (isKnown && bytes === 0) return;

            var a = document.createElement('a');
            a.href = 'https://docs.google.com/document/d/' + id;
            a.target = '_blank';
            a.textContent = (i + 1) + '冊目' + (isKnown ? ('（' + Math.round(bytes / 1024) + ' KB）') : '');
            tdDocs.appendChild(a);
          });

          var tdAct = document.createElement('td');
          var wrap = document.createElement('div');
          wrap.className = 'row-actions';

          var bCont = document.createElement('button');
          bCont.className = 'mini';
          bCont.textContent = '続き取得';
          bCont.onclick = function () {
            call('webStartContinuation', [w.url], '［' + w.shortTitle + '］');
          };

          var bDel = document.createElement('button');
          bDel.className = 'mini danger';
          bDel.textContent = '削除';
          bDel.onclick = function () {
            if (!confirm('「' + w.title + '」を一覧から外します。\n（取得済みドキュメント自体は削除されません）')) return;
            call('webClearResumeRecord', [w.url], '［' + w.shortTitle + '］');
          };

          wrap.appendChild(bCont);
          wrap.appendChild(bDel);
          tdAct.appendChild(wrap);

          tr.appendChild(tdTitle);
          tr.appendChild(tdTotal);
          tr.appendChild(tdUpd);
          tr.appendChild(tdDocs);
          tr.appendChild(tdAct);
          tb.appendChild(tr);
        });
      }

      function renderLinks(l) {
        var box = $('links');
        box.textContent = '';
        function add(url, label) {
          if (!url) return;
          var a = document.createElement('a');
          a.href = url; a.target = '_blank'; a.textContent = label;
          a.style.marginRight = '10px';
          box.appendChild(a);
        }
        add(l.indexUrl, '索引シート');
        add(l.panelUrl, '操作パネル');
      }

      // ---- 並び替え・絞り込み ----
      function setSort(key) {
        if (view.sortKey === key) {
          view.sortDir = (view.sortDir === 'asc') ? 'desc' : 'asc';
        } else {
          view.sortKey = key;
          view.sortDir = (key === 'title') ? 'asc' : 'desc'; // 名前は昇順、話数・日付は新しい/多い順から
        }
        renderTable();
      }

      function clearFilter() {
        $('filter').value = '';
        renderTable();
      }

      // ---- 各操作 ----
      function url()     { return $('url').value.trim(); }
      function startEp() { return $('startEp').value; }
      function endEp()   { return $('endEp').value; }

      function doStartFetch() {
        if (!url()) { log('作品URLを入力してください。', true); return; }
        if (!confirm('この作品を初回取得します。\n取得済みの場合は重複して保存される可能性があります。\n\n' + url())) return;
        call('webStartFetch', [url(), startEp(), endEp()]);
      }
      function doStartCont()  {
        if (!url()) { log('作品URLを入力してください。', true); return; }
        call('webStartContinuation', [url()]);
      }
      function doSeed()       {
        if (!url()) { log('作品URLを入力してください。', true); return; }
        call('webSeedResumeRecord', [url(), $('docIds').value]);
      }
      function doContAll()    {
        if (!confirm('一覧の全作品を順番に続き取得します。よろしいですか?')) return;
        call('webStartContinuationAll', []);
      }
      function doSync()       { call('webSyncFromSheet', []); }
      function doRebuild()    { call('webRebuildIndex', []); }
      function doClearQueue() { call('webClearQueue', []); }
      function doToggleShort(){ call('webToggleShortFilename', []); }

      // ---- 初期化・自動更新 ----
      window.addEventListener('load', function () {
        var ths = document.querySelectorAll('th.sortable');
        for (var i = 0; i < ths.length; i++) {
          (function (th) {
            th.onclick = function () { setSort(th.getAttribute('data-key')); };
          })(ths[i]);
        }

        refresh();
        google.script.run.withSuccessHandler(renderLinks).webGetLinks();
        timer = setInterval(function () { if (!busy) refresh(); }, 7000);
      });
    </script>
  </body>
</html>
